<!doctype html>
<html><head><meta charset="utf-8"><title>hub check</title>
<style>html,body{margin:0;background:#111}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// Review page for tools/hub-from-field.mjs: the cut HUB from four sides, with its bounds.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const canvas=document.getElementById('c');
const r=new THREE.WebGLRenderer({canvas,antialias:true}); r.setSize(innerWidth,innerHeight,false); r.setScissorTest(true);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x1a1c20);
scene.add(new THREE.HemisphereLight(0xffffff,0x333333,1.4)); const d=new THREE.DirectionalLight(0xffffff,2); d.position.set(3,5,4); scene.add(d);
const g=await new GLTFLoader().loadAsync('/models/hub.glb');
const colours=[0x8a93a0,0x2f74c8,0xcbb87b,0xd06060,0x60c080];
let i=0; g.scene.traverse(o=>{ if(o.isMesh){ o.material=new THREE.MeshStandardMaterial({color:colours[i++%colours.length],side:THREE.DoubleSide}); } });
scene.add(g.scene, new THREE.GridHelper(4,8,0x555555,0x333333));
const box=new THREE.Box3().setFromObject(g.scene); scene.add(new THREE.Box3Helper(box,0xffff00));
const cam=new THREE.PerspectiveCamera(35,1,0.05,50); const W=innerWidth/2,H=innerHeight/2;
[[0,0.6],[Math.PI/2,0.6],[Math.PI,0.2],[0.8,1.2]].forEach(([az,el],k)=>{
  const R=6; cam.aspect=W/H; cam.updateProjectionMatrix();
  cam.position.set(Math.sin(az)*Math.cos(el)*R,1+Math.sin(el)*R,Math.cos(az)*Math.cos(el)*R); cam.lookAt(0,1,0);
  const x=(k%2)*W, y=(k<2?H:0); r.setViewport(x,y,W,H); r.setScissor(x,y,W,H); r.render(scene,cam);
});
window.__spine={ready:true, settle(){return{box:[box.min.toArray(),box.max.toArray()].map(a=>a.map(v=>+v.toFixed(2)))}}, callouts(){return[]}};
</script></body></html>
